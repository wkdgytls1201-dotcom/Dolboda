# 공단 장기요양기관 데이터 일일 자동 수집 — scripts/daily-nhis-sync.mjs 참고.
# 매일 새벽 4시(KST, = 19:00 UTC)에 16개 지역 엑셀을 받아 변경분을 DB에 반영하고
# FacilitySnapshot(시계열)을 적재한다. 실패하면 GitHub이 저장소 소유자에게 메일을 보낸다.
#
# 필요한 저장소 시크릿(Settings → Secrets and variables → Actions):
#   DIRECT_URL — Supabase 직접 연결 문자열(.env.local의 DIRECT_URL 값 그대로)
#   TELEGRAM_BOT_TOKEN·TELEGRAM_CHAT_ID — (선택) 매일 결과 요약·실패 알림을 텔레그램으로 받기
#   RESEND_API_KEY·MAIL_FROM — (선택) 관심시설 빈자리·등급변동 알림 메일 발송.
#     없으면 사건만 세고 발송은 건너뛴다(워크플로는 깨지지 않음).
name: daily-nhis-sync

on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 04:00 KST
  workflow_dispatch: {} # 수동 실행 버튼 (테스트용)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci의 postinstall이 곧바로 prisma generate를 돌리고, prisma.config.ts는
      # datasource url로 env("DIRECT_URL")을 평가한다 — 그래서 설치 단계에도 값이 있어야 한다.
      # (이걸 뒤 단계에만 넣었다가 첫 실행이 `PrismaConfigEnvError: Cannot resolve
      #  environment variable: DIRECT_URL`로 17초 만에 죽었다.)
      # 여기서 이미 클라이언트가 생성되므로 별도 generate 단계는 두지 않는다.
      - name: 의존성 설치 (postinstall에서 Prisma Client 생성)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm ci

      - name: 수집·반영 실행
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/daily-nhis-sync.mjs --write

      # 관심시설 알림 — 위 수집이 적재한 오늘 스냅샷에서 사건을 다시 계산해 발송한다.
      # 수집이 넘겨주는 값에 기대지 않아서, 실패하면 이 단계만 따로 재실행해도 된다
      # (중복 발송은 AlertDelivery의 unique 제약이 막는다).
      #
      # RESEND_API_KEY가 없으면 사건만 세고 발송은 건너뛴다 — 그래서 시크릿을
      # 넣기 전에도 워크플로가 깨지지 않는다.
      #
      # continue-on-error: 알림은 부가 기능이다. 발송이 실패했다고 해서 이미 성공한
      # 데이터 수집까지 실패로 표시되면 진짜 문제를 놓친다.
      - name: 관심시설 알림 발송
        continue-on-error: true
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          NEXT_PUBLIC_SITE_URL: https://www.dolboda.kr
        run: node scripts/send-facility-alerts.mjs --write
